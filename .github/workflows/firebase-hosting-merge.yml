# This file was auto-generated manually to fix CLI error
name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
      - release/v1.1.0-prod
      - beta/alpha/v1.1.0
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install && npm run build
        env:
          VITE_FIREBASE_API_KEY: "${{ secrets.VITE_FIREBASE_API_KEY }}"
          VITE_FIREBASE_AUTH_DOMAIN: "${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}"
          VITE_FIREBASE_PROJECT_ID: "${{ secrets.VITE_FIREBASE_PROJECT_ID }}"
          VITE_FIREBASE_STORAGE_BUCKET: "${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
          VITE_FIREBASE_APP_ID: "${{ secrets.VITE_FIREBASE_APP_ID }}"
          VITE_SENTRY_DSN: "${{ secrets.VITE_SENTRY_DSN }}"
          VITE_GA_MEASUREMENT_ID: "${{ secrets.VITE_GA_MEASUREMENT_ID }}"
          VITE_CLARITY_PROJECT_ID: "${{ secrets.VITE_CLARITY_PROJECT_ID }}"
          VITE_RECAPTCHA_SITE_KEY: "${{ secrets.VITE_RECAPTCHA_SITE_KEY }}"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_AI_LEARNING_ROADMAP_PLATFORM }}'
          channelId: live
          projectId: ai-learning-roadmap-platform
